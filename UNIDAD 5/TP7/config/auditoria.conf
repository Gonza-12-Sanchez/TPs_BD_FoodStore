# Solo servidor de desarrollo. Reiniciar si cambia logging_collector.
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'foodstore-u5.log'
log_file_mode = 0600
log_connections = on
log_disconnections = on
log_statement = 'all'
log_min_messages = warning
log_min_error_statement = error
log_error_verbosity = terse
log_line_prefix = '%m [%p] sesion=%c usuario=%u db=%d app=%a origen=%r estado=%e '
log_timezone = 'UTC'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
# 'all' es temporal para B/C. Después del laboratorio volver a 'mod'.
# Los parámetros anteriores NO ocultan literales presentes en el texto SQL.
